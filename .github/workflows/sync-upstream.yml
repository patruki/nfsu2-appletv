# Keeps this fork up to date with the repo it was forked from (th0mk/nfsu2-web).
#
# Every day, and when started by hand, the original repo's new commits are merged into the branch
# upstream-sync and a pull request into main is opened (or updated).  It is a pull request, not a push to
# main, because every merge changes the translated C: ./gen.sh and a run on the Apple TV come before TestFlight.
# Merge it with "Create a merge commit": every merge commit on main raises the app's version (tvos/version.sh).
# A merge with conflicts is not made: the job fails, and the original repo is merged by hand.
#
# Needs, in the repo's settings: Actions on, and Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".  If the original repo changes a file in
# .github/workflows, the default token may not push that, so the secret SYNC_TOKEN (a personal access token with
# the repo and workflow scopes) is used when there is one.
name: sync-upstream
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
env:
  UPSTREAM: th0mk/nfsu2-web
  GH_REPO: ${{ github.repository }}       # the pull request goes to this repo, not to the one it was forked from
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Merge the original repo into upstream-sync
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet upstream main
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "Up to date with $UPSTREAM."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=$(git rev-list --count origin/main..upstream/main)" >> "$GITHUB_OUTPUT"
          git checkout -B upstream-sync origin/main
          if ! git merge --no-edit -m "Merge $UPSTREAM main" upstream/main; then
            git merge --abort
            echo "::error::Merging $UPSTREAM main into main has conflicts: merge it by hand."
            exit 1
          fi
          git push --force origin upstream-sync
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          NEW: ${{ steps.merge.outputs.new }}
        run: |
          if [ -n "$(gh pr list --head upstream-sync --state open --json number --jq '.[0].number')" ]; then
            echo "The pull request is open already: its branch has been updated."
            exit 0
          fi
          gh pr create --base main --head upstream-sync \
            --title "Sync with $UPSTREAM ($NEW new commits)" \
            --body "$(printf '%s\n' \
              "The original repo, $UPSTREAM, has $NEW commits that this fork lacks." \
              "" \
              "Before merging: pull the branch, run \`./gen.sh\` (the translated C changes), build with \`tvos/tv.sh run\` and play." \
              "Merge it with **Create a merge commit**: that raises the app's version (\`tvos/version.sh\`).")"
